[metadata]
name = telbot_llm
version = 0.1.0
description = A module for integrating LLM capabilities into the FundLink Telegram bot for humanitarian donations.
author = Your Name
author_email = your.email@example.com
url = https://github.com/yourusername/telbot_llm
license = MIT

[options]
packages = find:
install_requires =
    python-telegram-bot>=13.0
    httpx>=0.18.0
    pydantic>=1.8.0
    requests>=2.25.0
    web3>=5.0.0
    python-dotenv>=0.15.0

[options.packages.find]
where = telbot_llm

[options.extras_require]
dev =
    black
    flake8
    mypy
    pytest
    pytest-asyncio

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests
python_functions = test_*

[flake8]
max-line-length = 88
extend-ignore = E203, W503

[mypy]
files = telbot_llm, tests
ignore_missing_imports = True

[coverage:run]
branch = True
source = telbot_llm

[coverage:report]
show_missing = True
skip_covered = True