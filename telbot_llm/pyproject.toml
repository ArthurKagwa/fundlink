[tool]
name = "telbot_llm"
version = "0.1.0"
description = "A module for integrating LLM capabilities into the FundLink Telegram bot."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/yourusername/telbot_llm"
repository = "https://github.com/yourusername/telbot_llm"
keywords = ["telegram", "llm", "donations", "fundlink"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry.dependencies]
python = "^3.8"
httpx = "^0.21.1"
python-telegram-bot = "^13.7"
pydantic = "^1.8.2"
fastapi = "^0.68.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.4"
mypy = "^0.910"
black = "^21.7b0"
flake8 = "^3.9.2"