version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fundlink_prod
      POSTGRES_USER: fundlink_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fundlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundlink_prod"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for session storage and caching
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - fundlink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Web Application
  web:
    build:
      context: .
      target: web
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=fundlink_prod
      - DB_USER=fundlink_prod
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - AVALANCHE_RPC_URL=${AVALANCHE_RPC_URL}
      - AVALANCHE_CHAIN_ID=${AVALANCHE_CHAIN_ID}
      - USDT_CONTRACT_ADDRESS=${USDT_CONTRACT_ADDRESS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fundlink-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Telegram Bot with LLM Integration
  bot:
    build:
      context: .
      target: bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - BACKEND_URL=http://web:8000
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - TOGETHER_MODEL=${TOGETHER_MODEL}
      - TOGETHER_MODEL_FALLBACK=${TOGETHER_MODEL_FALLBACK}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - fundlink-network
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Donation Verifier Service
  verifier:
    build:
      context: .
      target: verifier
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - BACKEND_URL=http://web:8000
      - AVALANCHE_RPC_URL=${AVALANCHE_RPC_URL}
      - AVALANCHE_CHAIN_ID=${AVALANCHE_CHAIN_ID}
      - USDT_CONTRACT_ADDRESS=${USDT_CONTRACT_ADDRESS}
      - VERIFICATION_INTERVAL=${VERIFICATION_INTERVAL:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - fundlink-network
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
      - static_files:/var/www/static:ro
    depends_on:
      - web
    networks:
      - fundlink-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_files:

networks:
  fundlink-network:
    driver: bridge